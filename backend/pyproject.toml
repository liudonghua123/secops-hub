[project]
name = "secops-hub-backend"
version = "0.1.0"
description = "SecOps Hub - unit-level cybersecurity operations platform backend (FastAPI + fastmcp)"
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    "agentscope>=1.0,<2.0",
    "tqdm>=4.70.1",
    "mcp==1.30.0",
    "python-multipart>=0.0.32",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
]

[tool.uv]
package = false
